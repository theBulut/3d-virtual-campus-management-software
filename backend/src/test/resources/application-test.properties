# In-memory database so the context test does not depend on a running PostgreSQL.
spring.datasource.url=jdbc:h2:mem:campus;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
