server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Without this every request would arrive from the proxy address, and the registration rate
        # limit would count all visitors into one bucket.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The Unity build. .wasm needs its own MIME type, otherwise the browser refuses to stream-compile
    # it; the hashed asset files may be cached hard, the loader must not be.
    location /game/ {
        # This block replaces the default MIME map for the location, so every type used below the
        # path has to be listed — a missing entry silently becomes application/octet-stream.
        types {
            application/wasm            wasm;
            application/javascript      js;
            application/json            json;
            application/octet-stream    data;
            text/html                   html;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
