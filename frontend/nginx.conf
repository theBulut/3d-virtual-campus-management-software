server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Without this every request would arrive from the proxy address, and the registration rate
        # limit would count all visitors into one bucket.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The manifest is the one file that changes with every Unity build, so it is the one file that
    # must not be cached hard. It needs its own block: a location cannot cache one of its files
    # differently from the rest.
    location = /game/build-info.json {
        types { application/json json; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The Unity build. .wasm needs its own MIME type, otherwise the browser refuses to stream-compile
    # it; the file names carry no hash but change per build, which the manifest above resolves.
    location /game/ {
        # This block replaces the default MIME map for the location, so every type used below the
        # path has to be listed — a missing entry silently becomes application/octet-stream.
        types {
            application/wasm            wasm;
            application/javascript      js;
            application/json            json;
            application/octet-stream    data;
            text/html                   html;
        }

        # The campus build is several hundred MB uncompressed. Compressing here rather than in Unity
        # keeps the build's Compression Format on 'Disabled': pre-compressed .br/.gz files would need
        # matching Content-Encoding headers, and that is exactly what broke the embedding once before
        # (game/README.md). nginx sets the header for what it compresses itself, so it cannot drift.
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/wasm application/octet-stream application/javascript application/json;

        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
